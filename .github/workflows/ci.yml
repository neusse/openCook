name: CI

# Verify the source on every push to main. Manual runs are allowed from the
# Actions tab. Installable updates must use the existing local signing key.
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
